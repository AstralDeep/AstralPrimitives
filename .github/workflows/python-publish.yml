name: Publish to PyPI

on:
  push:
    branches: [main]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/astralprims
    permissions:
      id-token: write     # REQUIRED for OIDC trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build


      - name: Check if version already published
        id: check
        run: |
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")
          VER=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          EXISTS=$(python - "$PKG" "$VER" <<'PY'
          import sys, json, urllib.request, urllib.error
          pkg, ver = sys.argv[1], sys.argv[2]
          try:
              with urllib.request.urlopen(f"https://pypi.org/pypi/{pkg}/json", timeout=15) as r:
                  releases = json.load(r).get("releases", {})
              print("true" if ver in releases else "false")
          except urllib.error.HTTPError as e:
              # 404 = package not yet on PyPI, so this version can't exist
              print("false" if e.code == 404 else "error")
          PY
          )
          echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"
          echo "Package=$PKG Version=$VER Exists=$EXISTS"

      - name: Publish to PyPI
        if: steps.check.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
