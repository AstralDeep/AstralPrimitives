name: Publish to PyPI

on:
  push:
    branches: [main]

jobs:
  verify-package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v7.6.0
        with:
          version: "0.11.26"
      - name: Verify lock
        run: uv lock --check
      - name: Install locked CI tools
        run: uv sync --frozen --group ci
      - name: Lint
        run: uv run --frozen --group ci ruff check .
      - name: Test
        run: uv run --frozen --group ci pytest -q -p no:cacheprovider
      - name: Build wheel and source distribution
        run: uv build --build-constraints tooling/python-ci/build-requirements.lock.txt --require-hashes
      - name: Check distribution metadata
        run: uv run --frozen --group ci twine check dist/*
      - name: Check if version is already published
        id: check
        run: |
          PKG=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['name'])")
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          EXISTS=$(python - "$PKG" "$VER" <<'PY'
          import json
          import sys
          import urllib.error
          import urllib.request

          package, release = sys.argv[1:]
          try:
              with urllib.request.urlopen(
                  f"https://pypi.org/pypi/{package}/json", timeout=15
              ) as response:
                  releases = json.load(response).get("releases", {})
              print("true" if release in releases else "false")
          except urllib.error.HTTPError as error:
              print("false" if error.code == 404 else "error")
          PY
          )
          if [ "$EXISTS" = "error" ]; then
            echo "PyPI lookup failed" >&2
            exit 1
          fi
          echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"
          echo "Package=$PKG Version=$VER Exists=$EXISTS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: needs.verify-package.outputs.exists == 'false'
    needs: verify-package
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/astralprims
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b5eea1f12f8d447405e9c5ef416f0a38d4 # v5.0.0
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
