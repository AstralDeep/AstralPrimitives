name: CI qualification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.26"
          python-version: "3.11"
          enable-cache: true
      - name: Verify lock
        run: uv lock --check
      - name: Install locked CI tools
        run: uv sync --frozen --group ci
      - name: Lint
        run: uv run --frozen --group ci ruff check .
      - name: Qualify released API and wire compatibility
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: uv run --frozen --group ci python tooling/python-ci/check_package_compatibility.py --base-sha "$BASE_SHA"
      - name: Record test and qualification review diagnostics
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          uv run --frozen --group ci python scripts/ci_review_diagnostics.py \
            --base "$BASE_SHA" --head "$(git rev-parse HEAD)" --output ci-review-diagnostics.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-qualification-review
          path: ci-review-diagnostics.json
          if-no-files-found: error
      - name: Test with branch coverage
        run: >-
          uv run --frozen --group ci pytest -q -p no:cacheprovider
          --cov=ci_review_diagnostics --cov=astralprims --cov=tooling/python-ci --cov-branch --cov-report=xml --cov-fail-under=90
      - name: Prove focused regression effectiveness
        run: uv run --frozen --group ci python tooling/python-ci/check_regression_effectiveness.py
      - name: Qualify changed lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::BASE_SHA is not a 40-hex SHA"; exit 1; }
          [[ "$BASE_SHA" != 0000000000000000000000000000000000000000 ]] || { echo "::error::BASE_SHA is all zeros"; exit 1; }
          diff_cover_status=0
          uv run --frozen --group ci diff-cover coverage.xml \
            --compare-branch "$BASE_SHA" --diff-range-notation '..' --fail-under=90 \
            --format json:changed-coverage.json || diff_cover_status=$?
          uv run --frozen --group ci python tooling/python-ci/check_changed_coverage.py \
            changed-coverage.json --base-sha "$BASE_SHA" --fail-under=90
          exit "$diff_cover_status"
      - name: Build wheel and source distribution
        run: uv build --build-constraints tooling/python-ci/build-requirements.lock.txt --require-hashes
      - name: Check distribution metadata
        run: uv run --frozen --group ci twine check dist/*
      - name: Clean-install package smoke (wheel)
        run: |
          uv venv --python 3.11 .package-smoke-whl
          uv pip install --python .package-smoke-whl/bin/python dist/*.whl
          .package-smoke-whl/bin/python - <<'PY'
          from importlib.metadata import files, version
          from pathlib import Path
          import json
          import tomllib
          import astralprims
          from astralprims import Primitive, Text

          manifest = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          installed_version = version("astralprims")
          assert installed_version == manifest["project"]["version"]
          package_files = files("astralprims")
          assert package_files is not None
          assert any(
              path.as_posix() == "astralprims/py.typed" for path in package_files
          )
          assert Text(content="ci").to_dict() == {
              "type": "text",
              "content": "ci",
              "variant": "body",
          }
          assert astralprims.__version__ == installed_version
          for name in astralprims.__all__:
              getattr(astralprims, name)
          for case in json.loads(Path("tests/fixtures/released_wire.json").read_text(encoding="utf-8")):
              assert Primitive.from_dict(case["input"]).to_dict() == case["expected"]
          PY
      - name: Clean-install package smoke (source distribution)
        run: |
          mkdir -p .sdist-consume
          cd .sdist-consume
          uv build --wheel ../dist/*.tar.gz --out-dir dist \
            --build-constraints ../tooling/python-ci/build-requirements.lock.txt \
            --require-hashes
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python dist/*.whl
          .venv/bin/python -I - <<'PY'
          from importlib.metadata import files, version
          from pathlib import Path
          import json
          import sys
          import tomllib
          import astralprims
          from astralprims import Primitive, Text

          assert Path(astralprims.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          for name in astralprims.__all__:
              getattr(astralprims, name)
          manifest = tomllib.loads(Path("../pyproject.toml").read_text(encoding="utf-8"))
          installed_version = version("astralprims")
          assert installed_version == manifest["project"]["version"]
          package_files = files("astralprims")
          assert package_files is not None
          assert any(
              path.as_posix() == "astralprims/py.typed" for path in package_files
          )
          assert Text(content="ci-sdist").to_dict() == {
              "type": "text",
              "content": "ci-sdist",
              "variant": "body",
          }
          assert astralprims.__version__ == installed_version
          for case in json.loads(Path("../tests/fixtures/released_wire.json").read_text(encoding="utf-8")):
              assert Primitive.from_dict(case["input"]).to_dict() == case["expected"]
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.26"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Verify lock
        run: uv lock --check
      - name: Run supported-Python tests
        run: uv run --frozen --python ${{ matrix.python }} --group ci pytest -q -p no:cacheprovider

  gates:
    if: always()
    needs: [quality-package, compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every owner gate
        env:
          QUALITY_PACKAGE: ${{ needs.quality-package.result }}
          COMPATIBILITY: ${{ needs.compatibility.result }}
        run: |
          test "$QUALITY_PACKAGE" = success
          test "$COMPATIBILITY" = success
