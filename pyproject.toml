[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "astralprims"
version = "0.4.0"
description = "Composable, serializable UI primitives for Python"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Sam Armstrong", email = "admin@example.com" }]
keywords = ["ui", "primitives", "components", "json", "serialization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[dependency-groups]
ci = [
    "diff-cover==10.3.0; python_version >= '3.10'",
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "ruff==0.15.21",
    "twine==6.2.0",
]

[project.urls]
Homepage = "https://github.com/AstralDeep/AstralPrimitives"
Issues = "https://github.com/AstralDeep/AstralPrimitives/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/astralprims"]

[tool.pytest.ini_options]
testpaths = ["tests"]
